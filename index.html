<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國立科技高中─校園社團介紹網</title>
    <style>
        #main {
            width: 1024px;
            height: 768px;
            margin: auto;
            /* background: #000; */
        }

        #top {
            width: 1000px;
            height: 65px;
            margin: auto;
            /* background-color: aqua; */
        }

        #left {
            width: 215px;
            height: calc(768px - 65px -20px);
            float: left;
            margin-left: 12px;
            /* background-color: aliceblue; */
        }

        #menu {
            width: 215px;
            height: calc(768px - 65px - 20px - 25px);
            /* background-color: yellow; */
        }

        marquee {
            width: 770px;
            height: 29px;
            font-family: '標楷體';
            font-size: 24px;
            color: #0000ff;
        }

        #menu div {
            font-family: "標楷體";
            font-size: 24px;
            color: #ff00ff;
            font-weight: 500;
            text-decoration: underline;
            text-align: center;
        }

        #menu td {
            width: 215px;
            /* 也可以35px ，根據 menu1.png的高度設定40px 版型會比較好看 */
            height: 40px;
            text-align: center;
            font-family: "標楷體";
            font-size: 16px;
            color: #000;
            background: url(./images/menu1.png)no-repeat center;
        }

        #menu td:hover {
            background: url(./images/menu2.png);
        }

        #menu a {
            display: block;
            line-height: 40px;
        }

        #update {
            width: 215px;
            height: 25px;
            font-family: '標楷體';
            font-size: 16px;
            color: #000;
            text-align: center;
        }

        #right{
            w
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="top">
            <a href="./index.html"><img src="./images/logo.png" alt="國立科技高中校園社團介紹網" title="國立科技高中校園社團介紹網"></a>
        </div>

        <div id="left">
            <div id="menu">
                <div>社團介紹</div>
                <table>
                    <tr>
                        <td>吉他社</td>
                    </tr>
                    <tr>
                        <td>熱舞社</td>
                    </tr>
                    <tr>
                        <td>棒球社</td>
                    </tr>
                    <tr>
                        <td>羽球社</td>
                    </tr>
                    <tr>
                        <td>足球社</td>
                    </tr>
                    <tr>
                        <td>童軍社</td>
                    </tr>

                </table>

            </div>
            <div id="update">近更新日期：2016/11/27</div>
        </div>
        <div id="right">
            <marquee>歡迎光臨校園社團介紹網，參觀後請支持社團活 動並熱烈參與</marquee>
            <iframe src="./main.html" frameborder="0"></iframe>
        </div>
        <div id="footer">網頁設計及維護：20曾智鑫</div>
    </div>
</body>

</html>
